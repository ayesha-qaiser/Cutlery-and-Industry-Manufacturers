<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - CutleryHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f8f5ef;
        }

        .checkout-container {
            max-width: 1100px;
            margin: 50px auto;
        }

        .checkout-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .checkout-title {
            color: #c9a227;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .summary-card {
            background: #111;
            color: white;
            border-radius: 12px;
            padding: 25px;
        }

        .summary-card h3 {
            color: #c9a227;
        }

        .place-order-btn {
            background: #c9a227;
            border: none;
            color: #111;
            font-weight: 700;
            width: 100%;
            padding: 13px;
            border-radius: 7px;
        }

        .place-order-btn:hover {
            background: #a58112;
        }

    </style>

</head>


<body>


<div class="container checkout-container">

    <div class="row g-4">


        <!-- =========================
             CUSTOMER FORM
        ========================== -->

        <div class="col-lg-7">

            <div class="checkout-card">

                <h2 class="checkout-title">
                    <i class="fa-solid fa-credit-card"></i>
                    Checkout
                </h2>


                <form id="checkoutForm">


                    <!-- NAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            class="form-control"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="03XX-XXXXXXX"
                            required
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            id="address"
                            class="form-control"
                            rows="3"
                            placeholder="Enter your complete address"
                            required
                        ></textarea>

                    </div>


                    <!-- CITY -->

                    <div class="mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            class="form-control"
                            placeholder="Enter city"
                            required
                        >

                    </div>


                    <!-- POSTAL CODE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Postal Code
                        </label>

                        <input
                            type="text"
                            id="postalCode"
                            class="form-control"
                            placeholder="Enter postal code"
                            required
                        >

                    </div>


                    <!-- PAYMENT -->

                    <div class="mb-4">

                        <label class="form-label">
                            Payment Method
                        </label>


                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="payment"
                                value="Cash on Delivery"
                                checked
                            >

                            <label class="form-check-label">
                                Cash on Delivery
                            </label>

                        </div>


                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="payment"
                                value="Bank Transfer"
                            >

                            <label class="form-check-label">
                                Bank Transfer
                            </label>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="place-order-btn"
                    >

                        <i class="fa-solid fa-check"></i>

                        Place Order

                    </button>


                </form>

            </div>

        </div>



        <!-- =========================
             ORDER SUMMARY
        ========================== -->

        <div class="col-lg-5">

            <div class="summary-card">

                <div id="checkoutSummary">

                    <p>
                        Loading order summary...
                    </p>

                </div>

            </div>

        </div>


    </div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadCheckoutSummary();

    }
);


/* ==============================
   GET CART
============================== */

function getCart() {

    return JSON.parse(
        localStorage.getItem("cart")
    ) || [];

}


/* ==============================
   CHECKOUT SUMMARY
============================== */

function loadCheckoutSummary() {

    const cart = getCart();

    const summary =
        document.getElementById(
            "checkoutSummary"
        );


    if (cart.length === 0) {

        summary.innerHTML = `

            <div class="text-center">

                <i
                    class="fa-solid fa-cart-shopping"
                    style="font-size:40px;color:#c9a227;"
                ></i>

                <h3 class="mt-3">
                    Your Cart Is Empty
                </h3>

                <p>
                    Please add products before checkout.
                </p>

                <a
                    href="products.html"
                    class="btn btn-warning"
                >
                    Continue Shopping
                </a>

            </div>

        `;

        return;

    }


    let subtotal = 0;

    let totalItems = 0;

    let productsHTML = "";


    cart.forEach(function (item) {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 1;

        const itemTotal =
            price * quantity;


        subtotal += itemTotal;

        totalItems += quantity;


        productsHTML += `

            <div
                class="d-flex justify-content-between mb-3"
            >

                <div>

                    <strong>
                        ${item.name}
                    </strong>

                    <br>

                    <small>
                        Quantity: ${quantity}
                    </small>

                </div>

                <strong>
                    PKR ${itemTotal.toLocaleString()}
                </strong>

            </div>

        `;

    });


    const delivery =
        subtotal >= 5000 ? 0 : 250;


    const total =
        subtotal + delivery;


    summary.innerHTML = `

        <h3>
            <i class="fa-solid fa-cart-shopping"></i>
            Order Summary
        </h3>

        <hr>

        ${productsHTML}

        <hr>

        <div class="d-flex justify-content-between">

            <span>
                Items
            </span>

            <strong>
                ${totalItems}
            </strong>

        </div>


        <div
            class="d-flex justify-content-between mt-2"
        >

            <span>
                Subtotal
            </span>

            <strong>
                PKR ${subtotal.toLocaleString()}
            </strong>

        </div>


        <div
            class="d-flex justify-content-between mt-2"
        >

            <span>
                Delivery
            </span>

            <strong>

                ${
                    delivery === 0
                    ? "FREE"
                    : "PKR " +
                      delivery.toLocaleString()
                }

            </strong>

        </div>


        <hr>


        <div
            class="d-flex justify-content-between"
        >

            <strong>
                Total
            </strong>

            <strong
                style="color:#c9a227;font-size:22px;"
            >
                PKR ${total.toLocaleString()}
            </strong>

        </div>

    `;

}


/* ==============================
   PLACE ORDER
============================== */

document.getElementById(
    "checkoutForm"
).addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const cart = getCart();


        if (cart.length === 0) {

            alert(
                "Your cart is empty."
            );

            return;

        }


        const name =
            document.getElementById(
                "fullName"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const address =
            document.getElementById(
                "address"
            ).value.trim();


        const city =
            document.getElementById(
                "city"
            ).value.trim();


        const postalCode =
            document.getElementById(
                "postalCode"
            ).value.trim();


        const paymentElement =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        const paymentMethod =
            paymentElement
            ? paymentElement.value
            : "Cash on Delivery";


        let subtotal = 0;

        let totalItems = 0;


        cart.forEach(function (item) {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;


            subtotal +=
                price * quantity;


            totalItems += quantity;

        });


        const delivery =
            subtotal >= 5000 ? 0 : 250;


        const total =
            subtotal + delivery;


        const orderId =
            "CH-" + Date.now();


        const newOrder = {

            orderId: orderId,

            orderDate:
                new Date().toLocaleString(),

            status: "Pending",

            orderSource: "Add to Cart",


            customer: {

                name: name,

                email: email,

                phone: phone,

                address: address,

                city: city,

                postalCode: postalCode,

                paymentMethod:
                    paymentMethod

            },


            products:
                cart.map(function (item) {

                    return {

                        id: item.id,

                        name: item.name,

                        price:
                            Number(item.price) || 0,

                        quantity:
                            Number(item.quantity) || 1,

                        image:
                            item.image || "",

                        categoryName:
                            item.categoryName || ""

                    };

                }),


            subtotal: subtotal,

            delivery: delivery,

            total: total,

            totalItems: totalItems

        };


        let orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];


        orders.push(newOrder);


        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );


        localStorage.removeItem(
            "cart"
        );


        alert(
            "Order placed successfully!\n\n" +
            "Order ID: " +
            orderId
        );


        window.location.href =
            "dashboards/customerindex.html";

    }
);

</script>


</body>

</html>
